# After code changes, rebuild the image:
#   docker compose build bot --no-cache && docker compose up -d bot
#
# Start on boot: install scripts/real-avto-stack.service as a systemd unit.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      # Never hard-coded: POSTGRES_PASSWORD from the root .env (must match the password in every DATABASE_URL)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the root .env}
      POSTGRES_DB: real_avto_konkurs
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d real_avto_konkurs"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    # Conversation state (listing forms) must survive restarts and memory pressure: noeviction + AOF.
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *default-logging

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    # Only the root .env values the catalog needs (AI and Instagram keys are not passed to the backend)
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      BOT_USERNAME: ${BOT_USERNAME:-}
      # Password-less CRM sign-in through the Telegram Mini App
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      SALES_PHONE: ${SALES_PHONE:-}
      BUSINESS_NAME: ${BUSINESS_NAME:-}
      BUSINESS_ADDRESS: ${BUSINESS_ADDRESS:-}
      BUSINESS_HOURS: ${BUSINESS_HOURS:-}
      REAL_AVTO_MAP_URL: ${REAL_AVTO_MAP_URL:-}
      USD_RATE_UZS: ${USD_RATE_UZS:-}
      CAR_STALE_DAYS: ${CAR_STALE_DAYS:-7}
    init: true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:'+(process.env.PORT||3001)+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    # Local only (reached through the CRM/catalog nginx or a host reverse proxy). Never exposed directly.
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    stop_grace_period: 25s
    logging: *default-logging

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "3000:80"
    restart: unless-stopped
    stop_grace_period: 15s
    logging: *default-logging

  # Public car catalog (website + Telegram Mini App). Proxies /api/public/ only
  catalog:
    build: ./catalog
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "3002:80"
    restart: unless-stopped
    stop_grace_period: 15s
    logging: *default-logging

  bot:
    build: .
    env_file:
      - .env
    # Instagram webhook (when INSTAGRAM_ENABLED=true). Expose through an HTTPS reverse proxy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      REDIS_URL: redis://redis:6379/0
    init: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,sys,time; p='/tmp/bot_heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 180 else 1)\"",
        ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    stop_grace_period: 35s
    logging: *default-logging

volumes:
  pg_data:
  redis_data:
