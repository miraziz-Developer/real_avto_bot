name: On-sale reset

# Temporarily archives every car on sale so the owner can re-confirm them by forwarding channel posts
# (scripts/onsale_reset.py). Commit message "[onsale-reset]" → archive; "[onsale-undo]" → restore the previous statuses.
on:
  push:
    branches: [main, claude/lucid-pascal-2zqc9d]

jobs:
  reset:
    if: contains(github.event.head_commit.message, '[onsale-reset]') || contains(github.event.head_commit.message, '[onsale-undo]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '172.198.138.146' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'bozorliii' }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/real_avto_bot' }}
      SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
      UNDO: ${{ contains(github.event.head_commit.message, '[onsale-undo]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare login
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            echo "SSH_CMD=ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y -qq sshpass > /dev/null
            echo "SSH_CMD=sshpass -e ssh -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no" >> "$GITHUB_ENV"
          fi

      - name: Run
        run: |
          args="--apply"
          [ "$UNDO" = "true" ] && args="--undo --apply"
          $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_DIR' && docker compose exec -T bot python - $args" < scripts/onsale_reset.py

      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/deploy_key
