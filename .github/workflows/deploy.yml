name: Deploy

# Deploys the stack to the server over SSH (scripts/deploy_to_server.sh → scripts/server_setup.sh).
# Runs on demand, or on a push whose commit message contains "[deploy]".
# One-time setup — repository Settings → Secrets and variables → Actions:
#   secret DEPLOY_SSH_KEY  — the private SSH key for the server user (or DEPLOY_SSH_PASSWORD — the user's password)
#   secret DEPLOY_ENV      — contents of the bot's .env (used only on the first deploy; the server keeps its own)
#   variable DEPLOY_HOST / DEPLOY_USER / DEPLOY_DIR — optional overrides of the defaults below
on:
  workflow_dispatch:
  push:
    branches: [main, claude/lucid-pascal-2zqc9d]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '172.198.138.146' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'bozorliii' }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/real_avto_bot' }}
      SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ENV_FILE: ${{ secrets.DEPLOY_ENV }}
        run: |
          [ -n "$KEY" ] || [ -n "$SSHPASS" ] || { echo "::error::Add secret DEPLOY_SSH_KEY or DEPLOY_SSH_PASSWORD"; exit 1; }
          [ -n "$ENV_FILE" ] || { echo "::error::Secret DEPLOY_ENV is missing"; exit 1; }

      - name: Prepare login and .env
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ENV_FILE: ${{ secrets.DEPLOY_ENV }}
        run: |
          install -m 700 -d ~/.ssh
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            echo "DEPLOY_LOGIN=$HOME/.ssh/deploy_key" >> "$GITHUB_ENV"
            echo "SSH_CMD=ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y -qq sshpass > /dev/null
            echo "DEPLOY_LOGIN=password" >> "$GITHUB_ENV"
            echo "SSH_CMD=sshpass -e ssh -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no" >> "$GITHUB_ENV"
          fi
          printf '%s\n' "$ENV_FILE" > .env
          chmod 600 .env

      - name: Server status before deploy
        run: |
          $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" '
            echo "== memory"; free -h
            echo "== disk"; df -h / | tail -n 1
            echo "== containers"; docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          '

      # Commit message "[stop-bozorliii]" (or repository variable STOP_BOZORLIII=true): stop the other project on the
      # server to free memory. Only "docker compose stop": containers, volumes and files are kept, its .env is backed
      # up; bring it back with: cd /opt/bozorliii && docker compose -f docker-compose.prod.yml start
      - name: Stop bozorliii (temporary)
        if: contains(github.event.head_commit.message, '[stop-bozorliii]') || vars.STOP_BOZORLIII == 'true'
        run: |
          $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            cd /opt/bozorliii
            backup="$HOME/bozorliii_env_backup_$(date +%Y%m%d_%H%M%S)"
            cp -a .env "$backup" && chmod 600 "$backup" && echo ".env backup: $backup"
            docker compose -f docker-compose.prod.yml stop
            docker compose -f docker-compose.prod.yml ps
            echo "== memory after stop"; free -h
          '

      - name: Deploy
        env:
          # Never print generated passwords into the Actions log — admins get them in Telegram instead
          SETUP_QUIET_SECRETS: "1"
        run: bash scripts/deploy_to_server.sh "$DEPLOY_USER@$DEPLOY_HOST" "$DEPLOY_LOGIN" "$DEPLOY_DIR"

      - name: Server status after deploy
        if: always()
        run: |
          [ -n "${SSH_CMD:-}" ] || exit 0
          $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" "
            cd '$DEPLOY_DIR' 2>/dev/null && docker compose ps
            echo '== bot log (last 40 lines)'; docker compose logs --tail=40 bot 2>/dev/null
            echo '== memory'; free -h
          " || true

      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/deploy_key .env
